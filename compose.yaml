
services:
  backend:
    build:
      context: ./apps/backend
      target: development
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://customer_user:${POSTGRES_PASSWORD}@db:5432/customer_db
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./apps/frontend
      target: development
    ports:
      - "5173:5173"
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: customer_db
      POSTGRES_USER: customer_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U customer_user -d customer_db"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
